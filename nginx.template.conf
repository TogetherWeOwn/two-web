worker_processes 5;
daemon off;

worker_rlimit_nofile 8192;
pid /tmp/nginx.pid;
# main-context error_log: without it nginx opens its compiled default /var/log/nginx/error.log at
# startup, which does not exist in the Nixpacks image -> [emerg] and a crash loop (TOG-1217 follow-up).
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    include $!{nginx}/conf/mime.types;
    index index.html index.htm index.php;

    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout;
    error_log /dev/stderr;
    sendfile on;
    tcp_nopush on;
    server_names_hash_bucket_size 128;

    map $host $robots_tag {
        default "";
        staging.togetherweown.com "noindex, nofollow";
    }

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        root /app/public;

        # Security headers, values per docs/dns.md "Security headers" (set on the
        # origin so they apply to staging and the apex alike). X-Frame-Options is
        # DENY, not SAMEORIGIN: nothing frames this site, and DENY is what the
        # doc — and the CISO session-handling bar (TOG-5469) — pins.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header X-Frame-Options "DENY";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
        add_header X-Robots-Tag $robots_tag always;

        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        # No exact-match block for /robots.txt: it is a Laravel route built from
        # APP_URL (TOG-7071), not a static file, so it falls through `location /`
        # to the front controller and each environment serves its own Sitemap host.

        # Pin the manifest MIME independently of the image's nginx mime.types version.
        location = /site.webmanifest {
            types { }
            default_type application/manifest+json;
            try_files $uri =404;
        }

        # Immutable long-lived caching for versioned static assets (TOG-6785).
        # `/build/assets/*` filenames carry a Vite content hash, so a URL names
        # exact bytes and a year-long `immutable` can never serve stale code: a
        # rebuild mints new URLs and the HTML points at them. `/fonts/*` are
        # pinned binaries that likewise only change under a new filename.
        # Nothing else gets this header. HTML and the `/discord` join link must
        # stay revalidatable (the latter is `no-store` from
        # DiscordInviteController), so there is deliberately no Cache-Control
        # on `location /` or the `.php` block. No `always`: without it nginx
        # sends the header on success responses (200/304) but not on errors,
        # so a 404 for a mistyped hash is never cached for a year. An
        # `add_header` here replaces the server-level headers for these
        # responses (nginx inheritance); that is acceptable on hashed build
        # output and same-origin fonts, where HSTS/nosniff add nothing beyond
        # what the HTML document response already establishes.
        location /build/assets/ {
            access_log off;
            log_not_found off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /fonts/ {
            access_log off;
            log_not_found off;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param PHP_ADMIN_VALUE "expose_php=Off";
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
