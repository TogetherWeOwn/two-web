name: secret-scan

# Why this exists as well as GitHub's own secret scanning:
# GitHub's push protection is free on public repos. These repos are private
# until the launch hardening pass clears them, and on a private repo that
# feature is a paid add-on. This job is the free equivalent and it is a
# required check, so a secret cannot reach main by accident.
#
# It is not a substitute for care. A secret that reaches a branch is already
# leaked - rotate it, do not just delete the line.
#
# We run the gitleaks BINARY, not gitleaks/gitleaks-action@v2. The action
# refuses to run for an organization without a paid licence key:
#
#   [TWO-Gaming] is an organization. License key is required.
#   missing gitleaks license. Go grab one at gitleaks.io
#
# That is the refusal verbatim, from the first push back when these repos lived in
# the TWO-Gaming org. The org name is the only part the transfer changed:
# TogetherWeOwn is an organization too, so the action would refuse here just the
# same. Left as recorded rather than rewritten, because it is a transcript.
#
# Discovering that on the first push would have left
# the only secret scanning we have permanently red. The scanner itself is MIT
# licensed and free for anyone; only the convenience wrapper is sold. Pinned to
# a release by version so a new upstream rule set cannot turn the build red on
# a morning nobody changed anything.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # `name:` is pinned equal to the id, as in ci.yml and for the same reason:
  # `gitleaks` is a required check on `main`, protection matches the check-run
  # name, and a job that sets a different name stops answering to its id. The
  # required check then never arrives and every PR waits forever.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret added and then removed in an earlier commit
          # on the same branch is still a leak, and a shallow clone hides it.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the full history
        run: |
          set -euo pipefail
          # Walk every commit reachable from HEAD, which is why the checkout
          # above is unshallow. A secret that was added and then deleted in a
          # later commit is still a secret that was published.
          #
          # `--log-opts=HEAD` is what actually restricts it to HEAD. Without it
          # `gitleaks git .` scans *every ref in the clone*, which is not what
          # the line above used to claim and not what anyone reading this job
          # would expect. That matters here because `fetch-depth: 0` fetches all
          # branches, so an unrelated branch sitting on origin put its findings
          # into every open pull request's scan — each one red, naming a commit
          # the author had never touched and could not remove.
          #
          # Found by ci/verify-pipeline.sh --run on TOG-20: the run's own
          # `ci-verify/secret` branch, which exists to prove this job can go red,
          # turned the run's clean pull request red at the same time. The scan
          # there reported `ci-verify-credential.txt` at commit d2764f9 — the
          # head of a different pull request. Confirmed against the pinned
          # 8.30.1 on a two-branch repository: the credential is unreachable from
          # HEAD, `git log -p HEAD` finds nothing, and the scan still reports
          # "2 commits scanned" and one leak.
          #
          # This narrows what a pull request scan looks at; it does not narrow
          # what can reach `main`. Anything merging to `main` enters HEAD's own
          # history, so both the pull request scan and the `push: main` scan
          # still see it. What is no longer caught is a secret on a branch that
          # never goes near `main` — which a per-pull-request required check was
          # never the instrument for, because the author of an unrelated pull
          # request cannot act on it.
          #
          # --redact so the finding names the file and the rule but never
          # prints the value into a log anyone with read access can see.
          gitleaks git . --redact --verbose --exit-code 1 --log-opts=HEAD
