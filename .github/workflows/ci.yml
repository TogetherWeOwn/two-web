# The merge gate. Red means nobody merges — see docs/ci.md.
#
# Job names are contract: branch protection on `main` requires them by name. If you
# rename a job here, the required check silently never arrives and every PR waits
# forever. Rename in both places or not at all.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the first. Never cancel `main` — its result
# is what the staging deploy keys off.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Formatting and static analysis. No database, no browser. Under a minute, so it
  # is the first thing to go red on the ordinary mistakes.
  # ---------------------------------------------------------------------------
  static:
    name: static
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Where did this job actually run? `runs-on:` asks; only the job can
      # answer. Fails on a GitHub-hosted runner (which bills) and publishes its
      # runner_name as an annotation. First, so a misrouted job burns seconds
      # rather than a full suite. See ci/attest-runner.sh (TOG-2847).
      - name: Attest the runner
        run: ./ci/attest-runner.sh

      # `--lint` reads the performance budgets by loading ci/lighthouserc.cjs the
      # way lhci loads it, so this job needs node now. The runners have one
      # preinstalled, but every other job here pins the version and this should not
      # be the exception — an unpinned interpreter is exactly the kind of thing that
      # works until somebody upgrades the host. No install step follows it; seconds.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # And the attestation itself, which is the one check in this repository that
      # cannot be proved by the run it is part of: on a correctly-routed job it
      # passes, and so does a version that returns 0 unconditionally. This drives
      # it through a synthetic hosted runner, a spoofed name and an unaudited host
      # and pins the exit code and reason for each, then asserts every job in every
      # workflow still carries the step. Under a second, no network.
      - name: Runner attestation self-test
        run: ./ci/attest-runner-selftest.sh

      # The runners are persistent, which makes a leaked server a *cross-run*
      # failure: the first post-merge `main` run after the migration failed on a
      # tree that was green on the pull request, because `budgets` had left an
      # `artisan serve` bound to a port it gets handed again on that same runner
      # (TOG-2847). This pins the reclaim-and-teardown that fixes it, including
      # that the budgets job still calls both halves. Binds two high ports on
      # the runner for a moment; no network.
      - name: Port reclaim self-test
        run: ./ci/reclaim-ports-selftest.sh

      # The other half of that same failure. `budgets` is required on `main`, so a
      # bad mint stops every merge — and the message it printed named the symptom
      # and discarded the cause, twice: once at TOG-2847 where the real fault was
      # the leaked server above, and again at df1970e where the cause is still
      # unknown because the step threw it away (TOG-3220). This drives the minting
      # script against a stubbed artisan and pins that a crash and a silent success
      # produce two *different* messages, that both carry what the command said,
      # and that a good mint still masks the value it exports. Milliseconds, no
      # network, no database.
      - name: Session cookie mint self-test
        run: ./ci/mint-session-cookie-selftest.sh

      # The gate checks its own wiring, first, before anything slow. A pull request
      # that edits this file to something that reports green while it has stopped
      # gating is rejected by the pipeline it is disarming. Half a second, no
      # network — see ci/verify-pipeline.sh and docs/ci.md.
      - name: Gate wiring
        run: ./ci/verify-pipeline.sh --lint

      # And the check on the check. `--lint` is the only thing watching the gate,
      # so nothing downstream notices if it quietly stops catching anything — a
      # lint that always passes and a lint that works look identical from here.
      # This mutates a throwaway copy per defect and asserts it goes red for the
      # stated reason. Same half second, still no network.
      - name: Gate wiring self-test
        run: ./ci/verify-lint-selftest.sh

      # The assertions `--run` makes about the check conclusions a pull request
      # produced, plus the wait that feeds them and the cleanup that follows. They
      # otherwise execute only during a live acceptance run, which is how a wrong
      # one survived review and cost forty minutes of runner time to find (TWO-94).
      #
      # `verify-lint-selftest.sh` above already shells out to this, so for the
      # moment this step is a second route to the same 29 cases. It is here anyway,
      # because that coverage is incidental: it hangs off one line inside a case
      # about *linting*, and nothing states that removing it removes the only thing
      # testing `--run`. Named here, the dependency is visible in the job log and
      # survives that line being refactored away. Under a second, no network.
      - name: Acceptance-script self-test
        run: ./ci/verify-pipeline.sh --assert-selftest

      # `ci/verify-protection.sh` proves the jobs below are the checks GitHub
      # actually enforces on `main` — which is a different fact from "the job went
      # red", and the one nothing else here reads. It cannot run in this job: it
      # needs `Administration: read`, and handing every pull request a token that
      # can read the protection rule is a worse trade than running it by hand
      # after a protection change. What runs here is its self-test, on saved
      # responses, for the same reason the line above exists — so it does not go
      # quiet between the rare occasions anyone runs it.
      - name: Protection check self-test
        run: ./ci/verify-protection-selftest.sh

      # The weekly QA report is generated from check-run records, but its coverage
      # half is a repository contract: exactly six named journeys, each mapped to a
      # real Dusk test, and every partial journey called incomplete rather than
      # laundered through a feature test. This also pins the PR #259 4m50 baseline
      # and the same-commit definition of a flake without needing the GitHub API.
      # The weekly collector itself is ci/collect-suite-health.mjs; it uses `gh`
      # only when QA runs the report, while this step keeps its deterministic half
      # green on every pull request.
      - name: Dusk suite-health self-test
        run: node ci/suite-health-selftest.mjs

      # The Dusk app, OAuth provider, bot stub and queue worker are separate
      # processes. This is the mutation control on their receipt gate: bypassing
      # OAuth or skipping the bot call must make the required browser job red.
      - name: Dusk receipt gate self-test
        run: ./ci/dusk-receipts-selftest.sh

      # And the checks that stop the acceptance run before it wastes forty minutes
      # answering the wrong question — an unauthenticated gh, a workspace clone for
      # an origin, a dirty tree, an unreadable Actions API, or another `--run`
      # already live on the same fixed branch names (TWO-103). A precondition that
      # has quietly stopped firing is indistinguishable from one with nothing to
      # complain about, so it needs the same treatment `--lint` gets. Throwaway
      # repo, stub gh, no network.
      #
      # Plus `--cleanup`, which the live-run refusal names as the way out: a guard
      # blocking by glob while its recovery deleted a fixed list left branches that
      # could be neither started past nor cleared (TWO-109). A recovery command
      # nobody tests is a recovery command that silently stops recovering.
      - name: Run preconditions self-test
        run: ./ci/verify-run-preconditions-selftest.sh

      # The deploy guard, exercised with no target configured — which is the live
      # configuration today and the exact case that used to report green while
      # deploying nothing (TOG-913, surfaced on TOG-48 as a false "live on staging"
      # claim to the owner). It belongs here rather than in `deploy.yml` because the
      # interesting case is the *absence* of a deploy target, so it needs no secret,
      # no network and no server; and because `deploy.yml` only runs once `main` is
      # already green, which is far too late to stop the pull request that breaks it.
      - name: Deploy guard self-test
        run: ./ci/deploy-target-selftest.sh


      # The staging deploy notifier (TOG-7326): one Discord message per staging
      # run, observed against a stub receiver — success, failure and cancelled
      # all arrive, and a missing secret or a Discord outage warns but never
      # fails the job. Same offline shape as the guard above: no secret, no
      # network beyond 127.0.0.1, no server.
      - name: Deploy notifier self-test
        run: ./ci/deploy-notify-selftest.sh
      # The Nixpacks runtime setting that prevents PHP from disclosing its version
      # lives in nginx.template.conf. Keep its exact FastCGI scope pinned offline so
      # a later template edit cannot silently restore the X-Powered-By header.
      - name: PHP runtime config self-test
        run: ./ci/php-runtime-config-selftest.sh

      # `.env.example` is the source of truth for the file layout; `docs/env.md`
      # is the reference for what each key means. Before TOG-7282 nothing
      # watched the gap between them, so a var landed in one file and stayed
      # missing from the other until a fresh checkout or deploy broke on it.
      # Fails in both directions: an undocumented example key, or a documented
      # key that lives in neither the example nor the deliberate-absence
      # allowlist. Under a second, no network.
      - name: Env docs match .env.example
        run: ./ci/check-env-docs.sh

      # The check on the check. A drift script that always passes and one that
      # works look identical from here, so this throws drift at it in both
      # directions — plus the parser-failure shapes — and asserts it goes red
      # for the stated reason. Same half second, still no network.
      - name: Env docs check self-test
        run: ./ci/check-env-docs-selftest.sh

      # The `budgets` verdict, which had no test until it shipped a defect. lhci
      # runs there under `continue-on-error: true`, so its exit code is discarded
      # and `ci/lh-annotate.mjs` is what actually turns the job red — the whole
      # gate, untested. It failed on any unpassed assertion without reading
      # `level`, which promoted every `warn` tripwire to a blocking budget and
      # made /admin red on FCP while every CEO budget passed with headroom
      # (TOG-54). Pins both directions: a warning cannot block, and an
      # error-level breach cannot stop blocking. No Chrome, no lhci, no network.
      - name: Budget verdict self-test
        run: |
          ./ci/lh-annotate-selftest.sh
          ./ci/lh-failure-guard-selftest.sh

      # Cloudflare Access browser QA must send its service-token pair before the
      # first navigation and reject a 403, challenge page or redirected login as
      # evidence. The fixture uses fake values and a local server; the real secret
      # is never needed in a pull-request run. This config half also proves the
      # service secret never enters Lighthouse settings, which serialize to reports.
      - name: Cloudflare Access config self-test
        run: node ci/browser/cloudflare-access-config-selftest.mjs

      # The cutover gate's atomic-host classification (TOG-3178). It used to read
      # "not a 3xx" and print "the install is reachable off-CDN" — which the live
      # 403 (WordPress.com's domain-connection error page, zero install content)
      # does not support, and which argues for an irreversible deletion on
      # evidence nobody has. The arm that will one day report the hostname
      # retired has never been produced by the live host, so this selftest is the
      # only thing that ever executes it; it also pins the relaxation rejected on
      # TOG-1269 as vacuous, which prose on a card cannot do. Offline — it runs
      # off a committed capture, so the cutover check's network half stays manual
      # and Automattic cannot turn our build red.
      - name: Cutover atomic-host classifier self-test
        run: node ci/cutover-check.mjs --selftest

      # And the harness that keeps the self-test above honest: 11 plausible wrong
      # classifiers, each of which must turn it red. Offline and 2.5s, so it runs
      # per-PR rather than living as a command in a comment that nobody runs. It
      # reports NOT-APPLIED (and fails) when a mutation stops matching the source,
      # so a rename shows up as "update this mutation" instead of as a harness
      # that silently scores 11/11 against nothing.
      - name: Cutover atomic-host classifier mutation harness
        run: bash ci/atomic-host-mutants.sh

      # The DKIM key parser (TOG-1154). "The record is published" is not "our
      # mail authenticates": the Google console defaults to a 1024-bit key, and
      # `v=DKIM1; p=` is the RFC 6376 revoked form — both look like success to
      # anything that only asks whether the selector answers. This selftest is
      # negative controls for exactly those, plus the multi-string rejoin that
      # every 2048-bit TXT value needs. Offline half only: it generates its own
      # key pairs and makes no DNS query, so it needs no network. The `--live`
      # half hits third-party selectors and stays manual, so someone else's key
      # rotation cannot turn our build red.
      - name: Mail auth key parser self-test
        run: ./ci/mail-auth-check-selftest.sh

      # The mail-auth parser and its resolver-agreement logic (TOG-1154). Offline
      # only: the fixtures are generated keys and a scripted resolver, so there is
      # no network and a third party rotating a selector cannot turn us red — the
      # live third-party fixtures sit behind `--live` and stay manual.
      # Worth gating on because both defects this catches were silent. A 1024-bit
      # key and a revoked `p=` both publish clean and pass any check that only asks
      # whether the record answers; and comparing resolvers on rcode alone called
      # two DIFFERENT published keys "agreement".
      - name: Mail auth self-test
        run: ./ci/mail-auth-check-selftest.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, bcmath
          coverage: none
          tools: composer:v2

      # setup-php on self-hosted runners unpacks PHP from php-builder tarballs
      # and then re-points the SHARED /usr/bin/php at it via
      # update-alternatives — and every concurrent job on this host re-points
      # that link when its own setup-php runs (src/scripts/linux.sh:
      # add_php/switch_version; its installer even prefers `apt-fast`, the
      # process seen holding the dpkg lock in the dusk log). On TOG-5877 a job
      # that installed and verified 8.4 executed a later step under 8.3.35
      # after a concurrent setup-php re-pointed the shared link between them,
      # and pest once died with ETXTBSY on the shared composer shim. So
      # nothing below may resolve `php` or `composer` through PATH: pin the
      # versioned binary (the alternatives target, immune to the link switch),
      # copy the composer shim job-local, and invoke the copy explicitly
      # through the pinned binary. The smoke checks fail here, seconds in, if
      # the pin itself is broken.
      - name: Pin the setup-php PHP and Composer binaries (TOG-5877)
        run: |
          php_bin="$(command -v "php${PHP_VERSION}")"
          [ -n "$php_bin" ] || { echo "::error::php${PHP_VERSION} not found after setup-php — refusing to run on the wrong interpreter (TOG-5877)"; exit 1; }
          composer_src="$(command -v composer)"
          [ -n "$composer_src" ] || { echo "::error::composer not found after setup-php (TOG-5877)"; exit 1; }
          head -1 "$composer_src" | grep -q php || { echo "::error::composer is not a PHP script — cannot pin it to the pinned interpreter (TOG-5877)"; exit 1; }
          cp "$composer_src" "$RUNNER_TEMP/composer-pinned"
          echo "CI_PHP_BIN=$php_bin" >> "$GITHUB_ENV"
          echo "CI_COMPOSER_BIN=$RUNNER_TEMP/composer-pinned" >> "$GITHUB_ENV"
          "$php_bin" -v | head -1
          [ "$("$php_bin" -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" = "$PHP_VERSION" ] || { echo "::error::pinned PHP is $("$php_bin" -v | head -1), not PHP ${PHP_VERSION} — refusing to run on the wrong interpreter (TOG-5877)"; exit 1; }
          "$php_bin" "$RUNNER_TEMP/composer-pinned" --version

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - run: |
          "$CI_PHP_BIN" "$CI_COMPOSER_BIN" install --no-interaction --prefer-dist --no-progress

      # --test means "tell me, do not fix". CI never rewrites the author's code.
      - name: Pint
        run: |
            "$CI_PHP_BIN" vendor/bin/pint --test

      - name: PHPStan
        run: |
            "$CI_PHP_BIN" vendor/bin/phpstan analyse --memory-limit=512M --no-progress --error-format=github

  # ---------------------------------------------------------------------------
  # Pest: unit + feature, against real Postgres. Not sqlite — phpunit.xml explains
  # why, and a suite that passes on sqlite and fails on jsonb is worse than none.
  #
  # Named `pest`, not `tests`. `tests` is the aggregate at the bottom of this file,
  # because that is the required check on `main` (TWO-39) and a required check that
  # only covers Pest would let a red Dusk or a blown budget merge.
  # ---------------------------------------------------------------------------
  pest:
    name: pest
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: two_web
          POSTGRES_PASSWORD: two_web
          POSTGRES_DB: two_web_test
        # Let Docker choose a free host port. Five runners share one host, so a
        # fixed 5432 binding makes parallel jobs race before their first step.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U two_web -d two_web_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      # See the note in `static`. Every job attests; a job that does not could be
      # moved onto a billable runner with nothing going red (TOG-2847).
      - name: Attest the runner
        run: ./ci/attest-runner.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, bcmath
          coverage: none
          tools: composer:v2

      # setup-php on self-hosted runners unpacks PHP from php-builder tarballs
      # and then re-points the SHARED /usr/bin/php at it via
      # update-alternatives — and every concurrent job on this host re-points
      # that link when its own setup-php runs (src/scripts/linux.sh:
      # add_php/switch_version; its installer even prefers `apt-fast`, the
      # process seen holding the dpkg lock in the dusk log). On TOG-5877 a job
      # that installed and verified 8.4 executed a later step under 8.3.35
      # after a concurrent setup-php re-pointed the shared link between them,
      # and pest once died with ETXTBSY on the shared composer shim. So
      # nothing below may resolve `php` or `composer` through PATH: pin the
      # versioned binary (the alternatives target, immune to the link switch),
      # copy the composer shim job-local, and invoke the copy explicitly
      # through the pinned binary. The smoke checks fail here, seconds in, if
      # the pin itself is broken.
      - name: Pin the setup-php PHP and Composer binaries (TOG-5877)
        run: |
          php_bin="$(command -v "php${PHP_VERSION}")"
          [ -n "$php_bin" ] || { echo "::error::php${PHP_VERSION} not found after setup-php — refusing to run on the wrong interpreter (TOG-5877)"; exit 1; }
          composer_src="$(command -v composer)"
          [ -n "$composer_src" ] || { echo "::error::composer not found after setup-php (TOG-5877)"; exit 1; }
          head -1 "$composer_src" | grep -q php || { echo "::error::composer is not a PHP script — cannot pin it to the pinned interpreter (TOG-5877)"; exit 1; }
          cp "$composer_src" "$RUNNER_TEMP/composer-pinned"
          echo "CI_PHP_BIN=$php_bin" >> "$GITHUB_ENV"
          echo "CI_COMPOSER_BIN=$RUNNER_TEMP/composer-pinned" >> "$GITHUB_ENV"
          "$php_bin" -v | head -1
          [ "$("$php_bin" -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" = "$PHP_VERSION" ] || { echo "::error::pinned PHP is $("$php_bin" -v | head -1), not PHP ${PHP_VERSION} — refusing to run on the wrong interpreter (TOG-5877)"; exit 1; }
          "$php_bin" "$RUNNER_TEMP/composer-pinned" --version

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - run: |
          "$CI_PHP_BIN" "$CI_COMPOSER_BIN" install --no-interaction --prefer-dist --no-progress

      - name: Prepare .env
        env:
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          cp .env.example .env
          sed -i "s#^DB_PORT=.*#DB_PORT=${DB_PORT}#" .env
          "$CI_PHP_BIN" artisan key:generate

      # Migrations are run explicitly rather than left to RefreshDatabase so a broken
      # migration fails as a migration, not as forty confusing test failures.
      #
      # The connection is spelled out here because phpunit.xml's <env> block only
      # applies to PHPUnit, not to artisan — without this the migration would run
      # against `two_web` from .env.example, which does not exist on this service.
      # Real environment variables win over .env: Dotenv does not overwrite them.
      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
          DB_DATABASE: two_web_test
          DB_USERNAME: two_web
          DB_PASSWORD: two_web
        run: |
            "$CI_PHP_BIN" artisan migrate --force --no-interaction

      - name: Pest
        run: |
            "$CI_PHP_BIN" vendor/bin/pest --colors=always --ci

  # ---------------------------------------------------------------------------
  # Dusk: real Chrome, real HTTP server, real Postgres. The funnel lives or dies
  # here. Slowest job in the pipeline, so it runs in parallel with the others
  # rather than after them.
  # ---------------------------------------------------------------------------
  dusk:
    name: dusk
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: two_web
          POSTGRES_PASSWORD: two_web
          POSTGRES_DB: two_web
        # Let Docker choose a free host port. Five runners share one host, so a
        # fixed 5432 binding makes parallel jobs race before their first step.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U two_web -d two_web"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      # See the note in `static`. Every job attests; a job that does not could be
      # moved onto a billable runner with nothing going red (TOG-2847).
      - name: Attest the runner
        run: ./ci/attest-runner.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, bcmath
          coverage: none
          tools: composer:v2

      # See the pin note in `static`: the shared /usr/bin/php link moves under
      # concurrent jobs, so this job pins the versioned binary too.
      - name: Pin the setup-php PHP and Composer binaries (TOG-5877)
        run: |
          php_bin="$(command -v "php${PHP_VERSION}")"
          [ -n "$php_bin" ] || { echo "::error::php${PHP_VERSION} not found after setup-php — refusing to run on the wrong interpreter (TOG-5877)"; exit 1; }
          composer_src="$(command -v composer)"
          [ -n "$composer_src" ] || { echo "::error::composer not found after setup-php (TOG-5877)"; exit 1; }
          head -1 "$composer_src" | grep -q php || { echo "::error::composer is not a PHP script — cannot pin it to the pinned interpreter (TOG-5877)"; exit 1; }
          cp "$composer_src" "$RUNNER_TEMP/composer-pinned"
          echo "CI_PHP_BIN=$php_bin" >> "$GITHUB_ENV"
          echo "CI_COMPOSER_BIN=$RUNNER_TEMP/composer-pinned" >> "$GITHUB_ENV"
          "$php_bin" -v | head -1
          [ "$("$php_bin" -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" = "$PHP_VERSION" ] || { echo "::error::pinned PHP is $("$php_bin" -v | head -1), not PHP ${PHP_VERSION} — refusing to run on the wrong interpreter (TOG-5877)"; exit 1; }
          "$php_bin" "$RUNNER_TEMP/composer-pinned" --version

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - run: |
          "$CI_PHP_BIN" "$CI_COMPOSER_BIN" install --no-interaction --prefer-dist --no-progress

      # --include=dev because the runner sets NODE_ENV=production in some images and
      # vite is a devDependency. Same reason the composer setup script does it.
      - run: npm ci --include=dev
      - run: npm run build

      # Five runner processes share one host network namespace. Derive stable
      # per-runner ports so parallel Dusk/budgets jobs never bind the same socket.
      - name: Select runner-local ports
        run: ./ci/runner-ports.sh >> "$GITHUB_ENV"

      # The private runner is deliberately lean. Install a browser per job instead
      # of making an unversioned host package part of the runner contract. Ubuntu's
      # chromium-browser package is a snap transitional package, and snap is not a
      # reliable dependency inside an Actions job, so use Google's apt package.
      #
      # Three host flakes met here, all TOG-5877. First, the rbx1 uplink refuses
      # dl.google.com intermittently (4–6 of 30 connects, operator-measured), so
      # the download retries with backoff instead of failing the job on one
      # refused connection. Second, a prior run's Chrome install leaves its apt
      # source behind on the persistent runner, and a later `apt-get update`
      # dies on that stale source over IPv6 the VM does not have — so the
      # stale source is removed both before the update and after the install
      # (the .deb's postinst re-adds it; the browser stays installed without
      # it). Third, a host process (seen: apt-fast, which setup-php's own
      # installer prefers) can hold the dpkg lock, so the install retries
      # instead of failing on a lock held by somebody else's apt.
      - name: Install Chrome
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 \
            -o "$RUNNER_TEMP/google-chrome.deb" \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          for i in 1 2 3 4 5 6; do
            sudo apt-get install -y "$RUNNER_TEMP/google-chrome.deb" && break
            [ "$i" -eq 6 ] && { echo "::error::Chrome install failed after 6 attempts (TOG-5877)"; exit 1; }
            sleep 10
          done
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          echo "CHROME_BIN=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"

      # APP_URL must match the server Dusk talks to or every assertion on a redirect
      # fails with a hostname mismatch that reads like a test bug.
      - name: Prepare .env
        env:
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          cp .env.example .env
          sed -i "s#^APP_URL=.*#APP_URL=http://127.0.0.1:${CI_APP_PORT}#" .env
          sed -i 's#^APP_ENV=.*#APP_ENV=local#' .env
          sed -i "s#^DB_PORT=.*#DB_PORT=${DB_PORT}#" .env
          sed -i 's#^QUEUE_CONNECTION=.*#QUEUE_CONNECTION=database#' .env
          sed -i 's#^DISCORD_CLIENT_ID=.*#DISCORD_CLIENT_ID=dusk-client#' .env
          sed -i 's#^DISCORD_CLIENT_SECRET=.*#DISCORD_CLIENT_SECRET=dusk-secret#' .env
          sed -i "s#^BOT_ENDPOINT_URL=.*#BOT_ENDPOINT_URL=http://127.0.0.1:${CI_STUB_PORT}#" .env
          sed -i 's#^BOT_KEY_ID=.*#BOT_KEY_ID=dusk-web#' .env
          sed -i 's#^BOT_SHARED_SECRET=.*#BOT_SHARED_SECRET=dusk-shared-secret-at-least-32-characters#' .env
          printf '%s\n' \
            'DUSK_TEST_SEAMS=1' \
            "DUSK_DISCORD_PROVIDER_URL=http://127.0.0.1:${CI_STUB_PORT}" \
            "DISCORD_API_BASE=http://127.0.0.1:${CI_STUB_PORT}/api/v10" \
            'DUSK_BOT_RECEIPT=storage/logs/dusk-bot-receipt.json' >> .env
          "$CI_PHP_BIN" artisan key:generate
          "$CI_PHP_BIN" artisan config:clear

      - run: |
          "$CI_PHP_BIN" artisan migrate --force --no-interaction

      # --detect matches the driver to the Chrome the runner already has. Pinning a
      # version here is how Dusk suites start failing on a Tuesday for no reason.
      - name: Install matching ChromeDriver
        run: |
            "$CI_PHP_BIN" artisan dusk:chrome-driver --detect

      # Output goes to files, not the step's stdout. A backgrounded process holding
      # the step's pipe open makes the step hang until the job times out, and the
      # logs are worth having in the failure artifact anyway.
      - name: Start Dusk services
        run: |
          rm -f storage/logs/dusk-bot-receipt.json storage/logs/dusk-stub-calls.jsonl
          DUSK_STUB_PORT="$CI_STUB_PORT" node ci/dusk-stub.mjs > storage/logs/dusk-stub.log 2>&1 &
          echo $! > storage/logs/dusk-stub.pid
          CACHE_STORE=file "$CI_PHP_BIN" artisan queue:work --queue=default --sleep=1 --tries=1 --timeout=30 > storage/logs/queue.log 2>&1 &
          echo $! > storage/logs/queue.pid
          "$CI_PHP_BIN" artisan serve --host=127.0.0.1 --port="$CI_APP_PORT" --no-reload > storage/logs/serve.log 2>&1 &
          echo $! > storage/logs/serve.pid
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${CI_STUB_PORT}/up" > /dev/null && curl -fsS "http://127.0.0.1:${CI_APP_PORT}/up" > /dev/null; then
              echo "Dusk services up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the Dusk application or deterministic stub never answered"
          cat storage/logs/serve.log storage/logs/queue.log storage/logs/dusk-stub.log
          exit 1

      - name: Dusk
        run: |
            "$CI_PHP_BIN" artisan dusk --colors=always

      - name: Verify the external calls were observed
        run: |
            "$CI_PHP_BIN" ci/dusk-receipts-check.php

      - name: Stop Dusk services
        if: always()
        run: |
          for file in storage/logs/serve.pid storage/logs/queue.pid storage/logs/dusk-stub.pid; do
            if [ -s "$file" ]; then
              kill "$(cat "$file")" 2>/dev/null || true
            fi
          done

      # Dusk writes a screenshot, the page source and the browser console for every
      # failure. Without these a red Dusk job is unactionable and the team learns to
      # re-run it instead of reading it.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-failures
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            tests/Browser/source
            storage/logs
          retention-days: 14
          if-no-files-found: ignore

      # Every test now screenshots on pass or fail (tests/DuskTestCase.php
      # tearDown, TOG-782), so evidence exists regardless of outcome — hence
      # always() rather than failure() like the GH Actions upload above. This
      # goes to the Paperclip board as a second, parallel destination (the
      # owner asked for evidence he can watch from the board, not by clicking
      # into a GH Actions run); the GH Actions artifact upload above is
      # unrelated and untouched.
      #
      # continue-on-error rather than gating on the secret's presence: until
      # PAPERCLIP_BOARD_API_KEY is minted (a one-time human action — see PR
      # description) this step goes visibly red, which is a more honest
      # signal than silently skipping.
      - name: Upload Dusk evidence to Paperclip
        if: always()
        continue-on-error: true
        env:
          PAPERCLIP_API_URL: ${{ vars.PAPERCLIP_API_URL }}
          PAPERCLIP_API_KEY: ${{ secrets.PAPERCLIP_BOARD_API_KEY }}
          PAPERCLIP_COMPANY_ID: ${{ vars.PAPERCLIP_COMPANY_ID }}
          PAPERCLIP_TASK_ID: ${{ vars.PAPERCLIP_E2E_EVIDENCE_ISSUE_ID }}
          PAPERCLIP_RUN_ID: gh-actions-${{ github.run_id }}-${{ github.job }}
        run: |
          shopt -s nullglob
          for f in tests/Browser/screenshots/*.png; do
            name="$(basename "$f" .png)"
            ./.github/scripts/paperclip-upload-artifact.sh "$f" \
              --title "two-web/${{ github.run_id }}/dusk/${name}" \
              --summary "Dusk evidence, run ${{ github.run_id }}, job dusk"
          done

  # ---------------------------------------------------------------------------
  # Budgets. Performance and accessibility are enforced as failures, not warnings.
  # LCP < 2.0s and CLS < 0.1 on a mid-range phone profile; WCAG 2.2 AA with no
  # violations. Lowering either of these is a CEO decision, in writing — not a
  # commit to this file.
  # ---------------------------------------------------------------------------
  budgets:
    name: budgets
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: two_web
          POSTGRES_PASSWORD: two_web
          POSTGRES_DB: two_web
        # Let Docker choose a free host port. Five runners share one host, so a
        # fixed 5432 binding makes parallel jobs race before their first step.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U two_web -d two_web"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      # See the note in `static`. Every job attests; a job that does not could be
      # moved onto a billable runner with nothing going red (TOG-2847).
      - name: Attest the runner
        run: ./ci/attest-runner.sh

      # This job's PHP is only ever exec'd by `artisan serve` below, a plain
      # `php -S` loop that re-bootstraps the whole Laravel framework on every
      # request. The CLI SAPI ships with opcache off by default
      # (opcache.enable_cli=0), so that bootstrap gets recompiled from source on
      # every single Lighthouse request instead of once — a fixed ~200ms harness
      # tax on every gated page's TTFB that no user or production host ever pays
      # (TOG-3310). validate_timestamps=0 is safe because nothing touches the
      # checked-out PHP files between here and the server shutting down.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, bcmath, opcache
          coverage: none
          tools: composer:v2
          ini-values: opcache.enable=1, opcache.enable_cli=1, opcache.validate_timestamps=0

      # See the pin note in `static`: the shared /usr/bin/php link moves under
      # concurrent jobs, so this job pins the versioned binary too. Placed
      # before the opcache pin so every `php` below is already the right one.
      - name: Pin the setup-php PHP and Composer binaries (TOG-5877)
        run: |
          php_bin="$(command -v "php${PHP_VERSION}")"
          [ -n "$php_bin" ] || { echo "::error::php${PHP_VERSION} not found after setup-php — refusing to run on the wrong interpreter (TOG-5877)"; exit 1; }
          composer_src="$(command -v composer)"
          [ -n "$composer_src" ] || { echo "::error::composer not found after setup-php (TOG-5877)"; exit 1; }
          head -1 "$composer_src" | grep -q php || { echo "::error::composer is not a PHP script — cannot pin it to the pinned interpreter (TOG-5877)"; exit 1; }
          cp "$composer_src" "$RUNNER_TEMP/composer-pinned"
          echo "CI_PHP_BIN=$php_bin" >> "$GITHUB_ENV"
          echo "CI_COMPOSER_BIN=$RUNNER_TEMP/composer-pinned" >> "$GITHUB_ENV"
          "$php_bin" -v | head -1
          [ "$("$php_bin" -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')" = "$PHP_VERSION" ] || { echo "::error::pinned PHP is $("$php_bin" -v | head -1), not PHP ${PHP_VERSION} — refusing to run on the wrong interpreter (TOG-5877)"; exit 1; }
          "$php_bin" "$RUNNER_TEMP/composer-pinned" --version

      # setup-php's ini-values above land in the SHARED system PHP ini. On the
      # persistent self-hosted host up to five runner processes share that one
      # PHP install (see the port note near the top of this file), and a
      # concurrent pest/dusk/static job's setup-php — none of which ask for
      # opcache — rewrites that same shared cli ini and resets enable_cli to its
      # 0 default. The guard below then reads a fresh `php -i` off the clobbered
      # ini and hard-fails budgets for a race, not a regression: on TOG-3224 the
      # identical main tree went red on 305bf47 and green on 33c17eb minutes
      # apart. Re-pin the setting in a JOB-LOCAL scan dir the race cannot reach:
      # $RUNNER_TEMP is private to this runner process, a leading ':' keeps the
      # default conf.d (so setup-php's extensions still load), PHP scans our dir
      # last so it wins, and the child `php -S` that `artisan serve` spawns
      # inherits PHP_INI_SCAN_DIR from the env and reads it too.
      - name: Pin opcache in a job-local ini scan dir (TOG-3224)
        run: |
          dir="$RUNNER_TEMP/php-budgets-conf.d"
          mkdir -p "$dir"
          printf 'opcache.enable=1\nopcache.enable_cli=1\nopcache.validate_timestamps=0\n' > "$dir/zz-opcache-budgets.ini"
          echo "PHP_INI_SCAN_DIR=:$dir" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      # --no-dev: we measure what production serves. Debug tooling in the container
      # changes the numbers and flatters us.
      - run: |
          "$CI_PHP_BIN" "$CI_COMPOSER_BIN" install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - run: npm ci --include=dev
      - run: npm run build

      # Five runner processes share one host network namespace. Derive stable
      # per-runner ports so parallel Dusk/budgets jobs never bind the same socket.
      - name: Select runner-local ports
        run: ./ci/runner-ports.sh >> "$GITHUB_ENV"

      - name: Prepare a production-shaped app
        env:
          DB_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          cp .env.example .env
          sed -i 's#^APP_ENV=.*#APP_ENV=production#' .env
          sed -i 's#^APP_DEBUG=.*#APP_DEBUG=false#' .env
          sed -i "s#^APP_URL=.*#APP_URL=${CI_BASE_URL}#" .env
          sed -i "s#^DB_PORT=.*#DB_PORT=${DB_PORT}#" .env
          "$CI_PHP_BIN" artisan key:generate
          "$CI_PHP_BIN" artisan migrate --force --no-interaction
          "$CI_PHP_BIN" artisan config:cache
          "$CI_PHP_BIN" artisan route:cache
          "$CI_PHP_BIN" artisan view:cache

      # Backgrounded output goes to a file for the same reason as the Dusk job: a
      # process holding the step's pipe open hangs the step.
      #
      # The app listens on this runner's upstream port and ci/compressing-proxy.mjs
      # fronts it on the matching proxy port, so everything measured below arrives
      # gzipped the way every real host serves
      # it. `artisan serve` compresses nothing, and measuring an uncompressed
      # 603KB Filament stylesheet was reporting LCP 6.76s on /admin where the
      # compressed truth is 2.74s. See the header of that file.
      - name: Start the application server
        run: |
          # The runners are persistent and these ports are stable per runner, so
          # a server an earlier run leaked is still bound and would answer the
          # readiness probe below while the real server silently failed to bind.
          # See ci/reclaim-ports.sh (TOG-2847).
          ./ci/reclaim-ports.sh "$PROXY_UPSTREAM_PORT" "$PROXY_LISTEN_PORT"

          "$CI_PHP_BIN" artisan serve --host=127.0.0.1 --port="$PROXY_UPSTREAM_PORT" --no-reload > storage/logs/serve.log 2>&1 &
          echo $! > storage/logs/serve.pid
          node ci/compressing-proxy.mjs > storage/logs/proxy.log 2>&1 &
          echo $! > storage/logs/proxy.pid

          # Probe a process we actually started. `curl` alone cannot tell our
          # server from a stranger's on the same port, which is the whole defect
          # this step just cleaned up after.
          for i in $(seq 1 30); do
            if ! kill -0 "$(cat storage/logs/serve.pid)" 2>/dev/null; then
              echo "::error::the application server exited during startup — it could not bind ${PROXY_UPSTREAM_PORT}"
              cat storage/logs/serve.log storage/logs/proxy.log
              exit 1
            fi
            if curl -fsS "${CI_BASE_URL}/up" > /dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the application never answered /up — budgets could not be measured"
          cat storage/logs/serve.log storage/logs/proxy.log
          exit 1

      # Loud, permanent evidence for TOG-3310, not a one-off manual check: fails
      # the job if opcache is ever off for this PHP instead of letting the
      # ~200ms/request harness tax silently creep back into every gated page's
      # TTFB budget. With the enable flags now pinned in a job-local scan dir
      # (above), `php -i` inherits PHP_INI_SCAN_DIR and reads that pin, so this
      # can no longer flap on a concurrent job's setup-php (TOG-3224). What it
      # still catches: a runner image that drops the opcache extension entirely —
      # then the pin has no module to enable and enable_cli stays off, red here.
      - name: Confirm opcache is active and measure /up
        run: |
          status="$("$CI_PHP_BIN" -i | grep -E '^opcache\.(enable|enable_cli)\b')"
          echo "$status"
          echo "$status" | grep -q '^opcache.enable => On' || { echo "::error::opcache.enable is not On for this job's PHP — the TOG-3310 harness tax is back"; exit 1; }
          echo "$status" | grep -q '^opcache.enable_cli => On' || { echo "::error::opcache.enable_cli is not On — artisan serve won't opcode-cache across requests (TOG-3310)"; exit 1; }
          up_s="$(curl -sS -o /dev/null -w '%{time_total}' "${CI_BASE_URL}/up")"
          echo "/up responded in ${up_s}s"

      # Proves the front-end is actually compressing before anything is measured.
      # Without this a proxy that quietly fell back to passthrough would just look
      # like a slow site, and the budget failure would be blamed on the page.
      - name: Verify the budget harness compresses
        run: |
          encoding="$(curl -sS -o /dev/null -D - -H 'Accept-Encoding: gzip' "${CI_BASE_URL}/" | tr -d '\r' | awk 'tolower($1) == "content-encoding:" { print tolower($2) }')"
          if [ "$encoding" != "gzip" ]; then
            echo "::error::the budgets harness is not compressing (content-encoding: '${encoding:-none}') — the numbers below would not be what production serves"
            cat storage/logs/proxy.log
            exit 1
          fi
          echo "harness is serving gzip"

      # Pinned exactly. An unpinned budget tool is a budget that changes without a
      # commit. Fold these into package.json devDependencies when convenient.
      - name: Install budget tooling
        run: npm i --no-save --no-package-lock @lhci/cli@0.14.0 puppeteer@23.11.1 @axe-core/puppeteer@4.10.2 axe-core@4.10.2

      # This is the real-browser half of the Cloudflare Access regression guard.
      # The static job already tests config composition without Chrome; here a local
      # fixture proves both headers arrive on the first document request and that a
      # 403, challenge response, or redirected login cannot become accepted evidence.
      - name: Cloudflare Access browser self-test
        run: |
          CHROME_BIN="$(node -e "import('puppeteer').then(p => console.log(p.default.executablePath()))")"
          CHROME_BIN="$CHROME_BIN" node ci/browser/cloudflare-access-selftest.mjs

      # The moderator panel is behind Discord auth, so measuring it needs a real
      # session (TOG-54). Without this both tools would follow the redirect and
      # score the Discord handoff — a tiny page that passes every budget while
      # /admin goes unmeasured. ci/pages.cjs throws if this is empty, so a failure
      # to mint one is loud rather than a silent green.
      #
      # Loud was only ever half of it. This used to be an inline
      # `artisan ... | tail -1` that discarded stderr, took `tail`'s exit status
      # instead of artisan's, and gave two different causes the same message — so
      # it named the symptom and threw away the diagnosis (TOG-3220). The logic
      # moved into a script for the reason deploy.yml gives for ci/deploy-target.sh:
      # so it can be executed and tested rather than merely read. Every branch is
      # driven against a stubbed artisan in ci/mint-session-cookie-selftest.sh.
      - name: Mint a moderator session for the authenticated pages
        run: |
          ./ci/mint-session-cookie.sh

      # Three runs per URL, median reported. One run of LCP on a shared runner is
      # noise; see docs/flake-policy.md on why the answer was more samples and a
      # honest headroom margin rather than a retry.
      #
      # `continue-on-error` does NOT mean a breach is tolerated — the annotate step
      # below re-raises it and fails the job. It exists so the breached numbers get
      # turned into annotations before the job stops, which is the difference
      # between a red build that names the audit and one that says only "exit 1".
      # TOG-7021: LHCI shelled out to whatever Chrome the persistent host
      # happened to have — unpinned binary, no sandbox workarounds — and when
      # that Chrome died at startup the job failed with `Invalid URL:
      # undefined`, the DevTools endpoint of a browser that never started, and
      # zero assertion results. No retry: the flake policy forbids it. The fix
      # is declared up front instead — the same pinned Chromium every other
      # browser step in this job already measures with, plus launch flags that
      # match ci/browser/launch.mjs and ci/a11y.mjs — and the run log is kept
      # so the next crash is diagnosable from the artifact, not the log tail.
      - name: Lighthouse — performance budget
        id: lighthouse
        continue-on-error: true
        run: |
          set +e
          # chrome-launcher reads CHROME_PATH before any install detection, so
          # this is the Chromium downloaded with the pinned puppeteer above —
          # not whatever google-chrome-stable apt last put on this host.
          export CHROME_PATH="$(node -e "import('puppeteer').then(p => console.log(p.default.executablePath()))")"
          echo "measuring with $CHROME_PATH"
          # Tee the run into .lighthouseci so it ships inside the
          # budget-reports artifact below. A startup crash leaves no assertion
          # results; without this its error lives only in the step log.
          # Explicit exit code: steps.lighthouse.outcome below depends on it,
          # and a pipe through tee would report tee's status instead.
          mkdir -p .lighthouseci
          npx lhci autorun --config=./ci/lighthouserc.cjs > .lighthouseci/lhci.log 2>&1
          rc=$?
          cat .lighthouseci/lhci.log
          exit $rc

      # Reads what lhci already wrote and re-emits it as ::error::, then exits
      # non-zero if anything breached. Same verdict, readable without the job log.
      - name: Report the performance budget
        run: node ci/lh-annotate.mjs

      # A belt-and-braces guard on the step above: lhci exits non-zero for
      # warn-level assertions too, so its outcome alone is not the verdict. The
      # annotation step owns error-vs-warning; this only fails when Lighthouse
      # produced no assertion results and therefore measured nothing.
      - name: Fail if Lighthouse itself failed before producing results
        if: steps.lighthouse.outcome == 'failure'
        run: ./ci/lh-failure-guard.sh

      - name: Accessibility — WCAG 2.2 AA
        run: node ci/a11y.mjs

      # TOG-1163 in one line: the join button must be a button at every width,
      # not only above a breakpoint. axe does not catch this — an unstyled <a>
      # with good contrast and a real href passes WCAG on every rule axe has —
      # and Lighthouse scores the page at one width, so neither job above sees
      # it. The defect it encodes shipped on the old apex for months and was
      # only ever found by looking at a phone.
      #
      # `--navigate` because this host is ours and is not behind Cloudflare; the
      # curl path in that script exists for the challenged apex, and a real
      # navigation is strictly better where one is available.
      #
      # CHROME_BIN is read straight from the pinned puppeteer installed above, so
      # this measures the same browser build as the two jobs either side of it.
      # launch.mjs would otherwise fall back to a cache path that only exists on
      # the agent sandbox and then to the runner image's Chrome — that works, but
      # the version would drift with the image rather than with a commit, which is
      # what every other tool in this job is pinned against. `|| true` is
      # deliberately absent: if the browser is missing this must fail loudly here
      # rather than surface later as six CHALLENGED rows and an exit 2.
      - name: CTA is a button at every width
        run: |
          CHROME_BIN="$(node -e "import('puppeteer').then(p => console.log(p.default.executablePath()))")"
          echo "measuring with $CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node ci/browser/cta-breakpoints.mjs \
            --url "${CI_BASE_URL}/" --navigate --shots ci/cta-shots

      # The runners are persistent, so a process this job leaks outlives it and
      # breaks the *next* run on this host rather than this one — which is how
      # the first post-merge `main` run failed while the identical tree was
      # green on the pull request (TOG-2847). `dusk` has always stopped its
      # services; this job never did, because on a throwaway VM it did not have
      # to. `if: always()` so a red budget still cleans up after itself.
      - name: Stop the application server
        if: always()
        run: |
          for file in storage/logs/serve.pid storage/logs/proxy.pid; do
            if [ -s "$file" ]; then
              kill "$(cat "$file")" 2>/dev/null || true
            fi
          done

      # include-hidden-files, because `.lighthouseci` starts with a dot and
      # upload-artifact skips anything under a dot-folder by default. Without it
      # this artifact contained the a11y report and nothing else — 268 bytes,
      # every Lighthouse report silently dropped, and the one place you would go
      # to debug a breached budget was empty (TWO-93). Nothing here is secret:
      # both paths are generated reports, and the flag only applies to them.
      - name: Upload budget reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-reports
          path: |
            .lighthouseci
            ci/a11y-report.json
            ci/cta-shots
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The aggregate. It is one of the six required checks on `main` (TWO-36) — the
  # four jobs above are required too, so protection does not depend on this guard
  # staying correct through future edits. See docs/ci.md for the full list.
  #
  # Protection matches the check-run *name*, which is a job's `name:` when it sets
  # one and its id otherwise — which is why every job here pins the two to the same
  # string. Rename either half and the required check never arrives: every PR waits
  # forever, and it presents as CI hanging rather than as a misconfiguration.
  #
  # What this job buys on top of the four: anything added above goes red through
  # here the moment it is in `needs`, with no protection change at all.
  # ---------------------------------------------------------------------------
  tests:
    name: tests
    runs-on: [self-hosted, two-selfhosted]
    timeout-minutes: 5
    if: always()
    needs: [static, pest, dusk, budgets]
    steps:
      # This job had no checkout: it only reads `needs` results. It needs one now
      # so it can attest its own runner — the aggregate bills like any other job,
      # and being cheap is not the same as being free (TOG-2847).
      - uses: actions/checkout@v5

      - name: Attest the runner
        run: ./ci/attest-runner.sh

      - name: Gate
        run: |
          echo "static:  ${{ needs.static.result }}"
          echo "pest:    ${{ needs.pest.result }}"
          echo "dusk:    ${{ needs.dusk.result }}"
          echo "budgets: ${{ needs.budgets.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::CI is red. Nobody merges. Read the failing job — do not re-run it."
            exit 1
          fi
          echo "CI green."
