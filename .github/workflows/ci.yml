# The merge gate. Red means nobody merges — see docs/ci.md.
#
# Job names are contract: branch protection on `main` requires them by name. If you
# rename a job here, the required check silently never arrives and every PR waits
# forever. Rename in both places or not at all.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the first. Never cancel `main` — its result
# is what the staging deploy keys off.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Formatting and static analysis. No database, no browser. Under a minute, so it
  # is the first thing to go red on the ordinary mistakes.
  # ---------------------------------------------------------------------------
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # `--lint` reads the performance budgets by loading ci/lighthouserc.cjs the
      # way lhci loads it, so this job needs node now. ubuntu-24.04 ships one, but
      # every other job here pins the version and this should not be the exception
      # — an unpinned interpreter is exactly the kind of thing that works until the
      # runner image moves. No install step follows it; this is seconds.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The gate checks its own wiring, first, before anything slow. A pull request
      # that edits this file to something that reports green while it has stopped
      # gating is rejected by the pipeline it is disarming. Half a second, no
      # network — see ci/verify-pipeline.sh and docs/ci.md.
      - name: Gate wiring
        run: ./ci/verify-pipeline.sh --lint

      # And the check on the check. `--lint` is the only thing watching the gate,
      # so nothing downstream notices if it quietly stops catching anything — a
      # lint that always passes and a lint that works look identical from here.
      # This mutates a throwaway copy per defect and asserts it goes red for the
      # stated reason. Same half second, still no network.
      - name: Gate wiring self-test
        run: ./ci/verify-lint-selftest.sh

      # The assertions `--run` makes about the check conclusions a pull request
      # produced, plus the wait that feeds them and the cleanup that follows. They
      # otherwise execute only during a live acceptance run, which is how a wrong
      # one survived review and cost forty minutes of runner time to find (TWO-94).
      #
      # `verify-lint-selftest.sh` above already shells out to this, so for the
      # moment this step is a second route to the same 29 cases. It is here anyway,
      # because that coverage is incidental: it hangs off one line inside a case
      # about *linting*, and nothing states that removing it removes the only thing
      # testing `--run`. Named here, the dependency is visible in the job log and
      # survives that line being refactored away. Under a second, no network.
      - name: Acceptance-script self-test
        run: ./ci/verify-pipeline.sh --assert-selftest

      # `ci/verify-protection.sh` proves the jobs below are the checks GitHub
      # actually enforces on `main` — which is a different fact from "the job went
      # red", and the one nothing else here reads. It cannot run in this job: it
      # needs `Administration: read`, and handing every pull request a token that
      # can read the protection rule is a worse trade than running it by hand
      # after a protection change. What runs here is its self-test, on saved
      # responses, for the same reason the line above exists — so it does not go
      # quiet between the rare occasions anyone runs it.
      - name: Protection check self-test
        run: ./ci/verify-protection-selftest.sh

      # And the checks that stop the acceptance run before it wastes forty minutes
      # answering the wrong question — an unauthenticated gh, a workspace clone for
      # an origin, a dirty tree, an unreadable Actions API, or another `--run`
      # already live on the same fixed branch names (TWO-103). A precondition that
      # has quietly stopped firing is indistinguishable from one with nothing to
      # complain about, so it needs the same treatment `--lint` gets. Throwaway
      # repo, stub gh, no network.
      #
      # Plus `--cleanup`, which the live-run refusal names as the way out: a guard
      # blocking by glob while its recovery deleted a fixed list left branches that
      # could be neither started past nor cleared (TWO-109). A recovery command
      # nobody tests is a recovery command that silently stops recovering.
      - name: Run preconditions self-test
        run: ./ci/verify-run-preconditions-selftest.sh

      # The deploy guard, exercised with no target configured — which is the live
      # configuration today and the exact case that used to report green while
      # deploying nothing (TOG-913, surfaced on TOG-48 as a false "live on staging"
      # claim to the owner). It belongs here rather than in `deploy.yml` because the
      # interesting case is the *absence* of a deploy target, so it needs no secret,
      # no network and no server; and because `deploy.yml` only runs once `main` is
      # already green, which is far too late to stop the pull request that breaks it.
      - name: Deploy guard self-test
        run: ./ci/deploy-target-selftest.sh

      # The `budgets` verdict, which had no test until it shipped a defect. lhci
      # runs there under `continue-on-error: true`, so its exit code is discarded
      # and `ci/lh-annotate.mjs` is what actually turns the job red — the whole
      # gate, untested. It failed on any unpassed assertion without reading
      # `level`, which promoted every `warn` tripwire to a blocking budget and
      # made /admin red on FCP while every CEO budget passed with headroom
      # (TOG-54). Pins both directions: a warning cannot block, and an
      # error-level breach cannot stop blocking. No Chrome, no lhci, no network.
      - name: Budget verdict self-test
        run: ./ci/lh-annotate-selftest.sh

      # The DKIM key parser (TOG-1154). "The record is published" is not "our
      # mail authenticates": the Google console defaults to a 1024-bit key, and
      # `v=DKIM1; p=` is the RFC 6376 revoked form — both look like success to
      # anything that only asks whether the selector answers. This selftest is
      # negative controls for exactly those, plus the multi-string rejoin that
      # every 2048-bit TXT value needs. Offline half only: it generates its own
      # key pairs and makes no DNS query, so it needs no network. The `--live`
      # half hits third-party selectors and stays manual, so someone else's key
      # rotation cannot turn our build red.
      - name: Mail auth key parser self-test
        run: ./ci/mail-auth-check-selftest.sh

      # The mail-auth parser and its resolver-agreement logic (TOG-1154). Offline
      # only: the fixtures are generated keys and a scripted resolver, so there is
      # no network and a third party rotating a selector cannot turn us red — the
      # live third-party fixtures sit behind `--live` and stay manual.
      # Worth gating on because both defects this catches were silent. A 1024-bit
      # key and a revoked `p=` both publish clean and pass any check that only asks
      # whether the record answers; and comparing resolvers on rcode alone called
      # two DIFFERENT published keys "agreement".
      - name: Mail auth self-test
        run: ./ci/mail-auth-check-selftest.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      # --test means "tell me, do not fix". CI never rewrites the author's code.
      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress --error-format=github

  # ---------------------------------------------------------------------------
  # Pest: unit + feature, against real Postgres. Not sqlite — phpunit.xml explains
  # why, and a suite that passes on sqlite and fails on jsonb is worse than none.
  #
  # Named `pest`, not `tests`. `tests` is the aggregate at the bottom of this file,
  # because that is the required check on `main` (TWO-39) and a required check that
  # only covers Pest would let a red Dusk or a blown budget merge.
  # ---------------------------------------------------------------------------
  pest:
    name: pest
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: two_web
          POSTGRES_PASSWORD: two_web
          POSTGRES_DB: two_web_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U two_web -d two_web_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # Migrations are run explicitly rather than left to RefreshDatabase so a broken
      # migration fails as a migration, not as forty confusing test failures.
      #
      # The connection is spelled out here because phpunit.xml's <env> block only
      # applies to PHPUnit, not to artisan — without this the migration would run
      # against `two_web` from .env.example, which does not exist on this service.
      # Real environment variables win over .env: Dotenv does not overwrite them.
      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: two_web_test
          DB_USERNAME: two_web
          DB_PASSWORD: two_web
        run: php artisan migrate --force --no-interaction

      - name: Pest
        run: vendor/bin/pest --colors=always --ci

  # ---------------------------------------------------------------------------
  # Dusk: real Chrome, real HTTP server, real Postgres. The funnel lives or dies
  # here. Slowest job in the pipeline, so it runs in parallel with the others
  # rather than after them.
  # ---------------------------------------------------------------------------
  dusk:
    name: dusk
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: two_web
          POSTGRES_PASSWORD: two_web
          POSTGRES_DB: two_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U two_web -d two_web"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, bcmath
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      # --include=dev because the runner sets NODE_ENV=production in some images and
      # vite is a devDependency. Same reason the composer setup script does it.
      - run: npm ci --include=dev
      - run: npm run build

      # APP_URL must match the server Dusk talks to or every assertion on a redirect
      # fails with a hostname mismatch that reads like a test bug.
      - name: Prepare .env
        run: |
          cp .env.example .env
          sed -i 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8000#' .env
          sed -i 's#^APP_ENV=.*#APP_ENV=local#' .env
          php artisan key:generate
          php artisan config:clear

      - run: php artisan migrate --force --no-interaction

      # --detect matches the driver to the Chrome the runner already has. Pinning a
      # version here is how Dusk suites start failing on a Tuesday for no reason.
      - name: Install matching ChromeDriver
        run: php artisan dusk:chrome-driver --detect

      # Output goes to a file, not the step's stdout. A backgrounded process holding
      # the step's pipe open makes the step hang until the job times out, and the
      # log is worth having in the failure artifact anyway.
      - name: Start the application server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 --no-reload > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/up > /dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the application never answered /up — Dusk would have failed as a browser timeout"
          cat storage/logs/serve.log
          exit 1

      - name: Dusk
        run: php artisan dusk --colors=always

      # Dusk writes a screenshot, the page source and the browser console for every
      # failure. Without these a red Dusk job is unactionable and the team learns to
      # re-run it instead of reading it.
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-failures
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            tests/Browser/source
            storage/logs
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Budgets. Performance and accessibility are enforced as failures, not warnings.
  # LCP < 2.0s and CLS < 0.1 on a mid-range phone profile; WCAG 2.2 AA with no
  # violations. Lowering either of these is a CEO decision, in writing — not a
  # commit to this file.
  # ---------------------------------------------------------------------------
  budgets:
    name: budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: two_web
          POSTGRES_PASSWORD: two_web
          POSTGRES_DB: two_web
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U two_web -d two_web"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, bcmath
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ env.PHP_VERSION }}-

      # --no-dev: we measure what production serves. Debug tooling in the container
      # changes the numbers and flatters us.
      - run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - run: npm ci --include=dev
      - run: npm run build

      - name: Prepare a production-shaped app
        run: |
          cp .env.example .env
          sed -i 's#^APP_ENV=.*#APP_ENV=production#' .env
          sed -i 's#^APP_DEBUG=.*#APP_DEBUG=false#' .env
          sed -i 's#^APP_URL=.*#APP_URL=http://127.0.0.1:8000#' .env
          php artisan key:generate
          php artisan migrate --force --no-interaction
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      # Backgrounded output goes to a file for the same reason as the Dusk job: a
      # process holding the step's pipe open hangs the step.
      #
      # The app listens on 8001 and ci/compressing-proxy.mjs fronts it on 8000, so
      # everything measured below arrives gzipped the way every real host serves
      # it. `artisan serve` compresses nothing, and measuring an uncompressed
      # 603KB Filament stylesheet was reporting LCP 6.76s on /admin where the
      # compressed truth is 2.74s. See the header of that file.
      - name: Start the application server
        run: |
          php artisan serve --host=127.0.0.1 --port=8001 --no-reload > storage/logs/serve.log 2>&1 &
          node ci/compressing-proxy.mjs > storage/logs/proxy.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/up > /dev/null; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the application never answered /up — budgets could not be measured"
          cat storage/logs/serve.log storage/logs/proxy.log
          exit 1

      # Proves the front-end is actually compressing before anything is measured.
      # Without this a proxy that quietly fell back to passthrough would just look
      # like a slow site, and the budget failure would be blamed on the page.
      - name: Verify the budget harness compresses
        run: |
          encoding="$(curl -sS -o /dev/null -D - -H 'Accept-Encoding: gzip' http://127.0.0.1:8000/ | tr -d '\r' | awk 'tolower($1) == "content-encoding:" { print tolower($2) }')"
          if [ "$encoding" != "gzip" ]; then
            echo "::error::the budgets harness is not compressing (content-encoding: '${encoding:-none}') — the numbers below would not be what production serves"
            cat storage/logs/proxy.log
            exit 1
          fi
          echo "harness is serving gzip"

      # Pinned exactly. An unpinned budget tool is a budget that changes without a
      # commit. Fold these into package.json devDependencies when convenient.
      - name: Install budget tooling
        run: npm i --no-save --no-package-lock @lhci/cli@0.14.0 puppeteer@23.11.1 @axe-core/puppeteer@4.10.2 axe-core@4.10.2

      # The moderator panel is behind Discord auth, so measuring it needs a real
      # session (TOG-54). Without this both tools would follow the redirect and
      # score the Discord handoff — a tiny page that passes every budget while
      # /admin goes unmeasured. ci/pages.cjs throws if this is empty, so a failure
      # to mint one is loud rather than a silent green.
      - name: Mint a moderator session for the authenticated pages
        run: |
          COOKIE="$(php artisan ci:session-cookie --moderator | tail -1)"
          if [ -z "$COOKIE" ]; then
            echo "::error::could not mint a session cookie — /admin cannot be measured"
            exit 1
          fi
          # Masked so the session value never appears in a public build log.
          echo "::add-mask::${COOKIE#*=}"
          echo "CI_SESSION_COOKIE=$COOKIE" >> "$GITHUB_ENV"

      # Three runs per URL, median reported. One run of LCP on a shared runner is
      # noise; see docs/flake-policy.md on why the answer was more samples and a
      # honest headroom margin rather than a retry.
      #
      # `continue-on-error` does NOT mean a breach is tolerated — the annotate step
      # below re-raises it and fails the job. It exists so the breached numbers get
      # turned into annotations before the job stops, which is the difference
      # between a red build that names the audit and one that says only "exit 1".
      - name: Lighthouse — performance budget
        id: lighthouse
        continue-on-error: true
        run: npx lhci autorun --config=./ci/lighthouserc.cjs

      # Reads what lhci already wrote and re-emits it as ::error::, then exits
      # non-zero if anything breached. Same verdict, readable without the job log.
      - name: Report the performance budget
        run: node ci/lh-annotate.mjs

      # A belt-and-braces guard on the step above: if lhci fell over for a reason
      # that produced no assertion results at all — a crashed Chrome, a server that
      # went away mid-run — the annotate step has nothing to fail on, and the job
      # must still go red rather than sail past a budget that was never measured.
      - name: Fail if Lighthouse itself failed
        if: steps.lighthouse.outcome == 'failure'
        run: |
          echo "::error::the Lighthouse step failed — see the annotations above for the breached audit, or the budget-reports artifact if there are none."
          exit 1

      - name: Accessibility — WCAG 2.2 AA
        run: node ci/a11y.mjs

      # include-hidden-files, because `.lighthouseci` starts with a dot and
      # upload-artifact skips anything under a dot-folder by default. Without it
      # this artifact contained the a11y report and nothing else — 268 bytes,
      # every Lighthouse report silently dropped, and the one place you would go
      # to debug a breached budget was empty (TWO-93). Nothing here is secret:
      # both paths are generated reports, and the flag only applies to them.
      - name: Upload budget reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-reports
          path: |
            .lighthouseci
            ci/a11y-report.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The aggregate. It is one of the six required checks on `main` (TWO-36) — the
  # four jobs above are required too, so protection does not depend on this guard
  # staying correct through future edits. See docs/ci.md for the full list.
  #
  # Protection matches the check-run *name*, which is a job's `name:` when it sets
  # one and its id otherwise — which is why every job here pins the two to the same
  # string. Rename either half and the required check never arrives: every PR waits
  # forever, and it presents as CI hanging rather than as a misconfiguration.
  #
  # What this job buys on top of the four: anything added above goes red through
  # here the moment it is in `needs`, with no protection change at all.
  # ---------------------------------------------------------------------------
  tests:
    name: tests
    runs-on: ubuntu-24.04
    if: always()
    needs: [static, pest, dusk, budgets]
    steps:
      - name: Gate
        run: |
          echo "static:  ${{ needs.static.result }}"
          echo "pest:    ${{ needs.pest.result }}"
          echo "dusk:    ${{ needs.dusk.result }}"
          echo "budgets: ${{ needs.budgets.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::CI is red. Nobody merges. Read the failing job — do not re-run it."
            exit 1
          fi
          echo "CI green."
